[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "swappy_bird"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
  "pygame-ce>=2.0.0",
  "pywin32==312",
  "ruff>=0.17.0"
]

[project.scripts]
swappy-bird = "swappy_bird.__main__:main"

