[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[project]
name = "swappy_bird"
version = "0.0.0"
requires-python = "==3.13.*"
dependencies = [
  "pygame-ce>=2.0.0",
  "pywin32==312"
]

[dependency-groups]
dev = [
  "pre-commit>=4.3.0",
  "ruff>=0.17.0",
  "pyinstaller>=6.0.0",
  "pillow>=13.0.0",
  "ty>=0.0.104",
]

[project.scripts]
swappy-bird = "swappy_bird.__main__:main"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "COM819",
  "CPY001",
  "D203",
  "D206",
  "D212",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",
]

[tool.ty.rules]
all = "error"
